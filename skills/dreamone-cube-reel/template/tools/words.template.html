  <div id="root" data-composition-id="words" data-width="1080" data-height="1920">
    <img id="w-logo" class="clip" data-start="0" data-duration="{{D}}" data-track-index="0" src="assets/logo-dreamone-horizontal.png" alt="夢想一號魔術方塊學院" />
<!--TOP-->
  </div>
  <script>
    (function () {
      const R = window.ReelData, N = R.numbers, ev = R.ev, D = R.DURATION;
      const $ = (sel) => Array.from(document.querySelectorAll(sel));
      const span = (id) => document.querySelector("#" + id + " > span");
      const T = (el) => [parseFloat(el.dataset.start), parseFloat(el.dataset.duration)];
      // 畫面上的數字一律取自 lib/reel-data.js
      $("[data-num]").forEach((el) => (el.textContent = N[el.dataset.num]));

      const tl = gsap.timeline({ paused: true });
      const fadeOut = (el) => {
        const [s, d] = T(el);
        if (s + d < D - 0.01) tl.to(el.firstElementChild, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, s + d - 0.15);
      };
      $(".w-top").forEach(fadeOut);
      const land = (id, from) => tl.fromTo(span(id), { opacity: 0, ...from }, { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, T(document.getElementById(id))[0]);

      // 三種小塊的數量：旁白念到哪一種，數字就落下來
      ["w-k1", "w-k2", "w-k3"].forEach((id) => land(id, { scale: 0.5, filter: "blur(8px)" }));

      // 算式第一列：每一項跟著方塊的動作一項一項出現
      const rows = {
        "w-d3a": { at: R.pops.slice(0, 8).map((p) => p.t), eq: ev.cornerPermEq },
        "w-d3b": { at: ev.cornerOriTerms, eq: ev.cornerOriEq },
        "w-d4a": { at: R.pops.slice(8).map((p) => p.t), eq: ev.edgePermEq },
        "w-d4b": { at: ev.edgeOriTerms, eq: ev.edgeOriEq },
      };
      Object.entries(rows).forEach(([id, cfg]) => {
        const el = document.getElementById(id);
        Array.from(el.querySelectorAll("i:not(.eq)")).forEach((it, i) => tl.fromTo(it, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2.2)" }, cfg.at[i]));
        tl.fromTo(el.querySelector(".eq"), { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, cfg.eq);
      });

      // 算式第二列：每算完一步，結果落進乘法鏈
      $(".w-term").forEach((el) => tl.fromTo(el.firstElementChild, { opacity: 0, y: -22, scale: 1.25, filter: "blur(6px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.42, ease: "power4.out" }, T(el)[0]));

      // 20 位數：由左到右一位一位鎖定
      const box = document.getElementById("w-d6-digits");
      box.innerHTML = "= " + [...N.total].map((ch) => (ch === "," ? "<i>,</i>" : '<i class="dg">' + ch + "</i>")).join("");
      const dg = Array.from(box.querySelectorAll(".dg")), finalDigits = [...N.totalRaw];
      const roll = { p: 0 };
      const paint = () => {
        const locked = Math.floor(roll.p * dg.length + 1e-6), tick = Math.floor(roll.p * 40);
        dg.forEach((el, i) => (el.textContent = i < locked ? finalDigits[i] : String((i * 7 + tick * 3 + ((i * tick) % 5)) % 10)));
      };
      tl.fromTo(span("w-d6"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, ev.digitsIn);
      tl.fromTo(roll, { p: 0 }, { p: 1, duration: ev.rollDur, ease: "none", onUpdate: paint }, ev.rollStart);
      paint();

      // 答案與結尾的大數字：由大落定
      land("w-hero", { scale: 1.6, filter: "blur(14px)" });
      land("w-years", { scale: 1.4, filter: "blur(10px)" });
      land("w-universe", { y: -16, filter: "blur(6px)" });
      land("w-src", {});
      land("w-god", { scale: 1.4, filter: "blur(10px)" });
      land("w-god2", { y: -12, filter: "blur(6px)" });

      window.__timelines = window.__timelines || {};
      window.__timelines["words"] = tl;
    })();
  </script>
