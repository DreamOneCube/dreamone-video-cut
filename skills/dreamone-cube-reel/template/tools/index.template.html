<!doctype html>
<!-- 由 npm run build 從 tools/index.template.html 產生；要改請改範本 -->
<html lang="zh-Hant" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <!-- 方塊引擎、時間軸與腳本資料：影片裡所有方塊狀態與數字的唯一來源 -->
    <script src="lib/cube-engine.js"></script>
    <script src="lib/timing.js"></script>
    <script src="lib/reel-data.js"></script>
    <style>
      :root {
        --ground: #0f2f7a;
        --floor: #2458c8;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      /* 攝影棚地面：方塊腳下一塊被打亮的地板（格線在 3D 場景裡） */
      #ground {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 800px 340px at 540px 1170px, var(--floor) 0%, rgba(36, 88, 200, 0) 100%),
          var(--ground);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{D}}" data-width="1080" data-height="1920">
      <div id="ground" data-layout-ignore></div>
      <div
        id="cube"
        data-composition-id="cube"
        data-composition-src="compositions/cube.html"
        data-start="0"
        data-duration="{{D}}"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="words"
        data-composition-id="words"
        data-composition-src="compositions/words.html"
        data-start="0"
        data-duration="{{D}}"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="{{D}}"
        data-track-index="3"
        data-track-kind="captions"
        data-width="1080"
        data-height="1920"
      ></div>
<!--AUDIO-->
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
